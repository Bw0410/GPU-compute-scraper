name: Test OCI scraper

on:
  workflow_dispatch:      # manual only: no schedule, so it never runs on its own

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt     # needs pandas, requests, beautifulsoup4, tzdata

      - name: Run OCI script
        run: python OCI_script.py

      - name: Show the saved CSV in the log
        run: head -20 OCI.csv

      - name: Upload CSV as a downloadable file (no commit)
        uses: actions/upload-artifact@v4
        with:
          name: oci-test-output
          path: OCI.csv

      # Optional: uncomment to also save the CSV into the repo
