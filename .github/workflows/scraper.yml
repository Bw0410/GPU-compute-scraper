name: Run GPU Scraper

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Run AWS script
        run: python AWS_script.py

      - name: Run Verda script
        run: python Verda_script.py

      - name: Run Coreweave script
        run: python coreweave.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add AMZN.csv verda_pricing_history.csv coreweave_na_pricing_history.csv coreweave_eu_pricing_history.csv
          git commit -m "Update GPU pricing data - $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
          git commit -m "Update GPU pricing data - $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
