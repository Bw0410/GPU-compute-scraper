
name: Test Google Cloud GPU Scraper

on:
  workflow_dispatch:      # manual only: never runs automatically

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Google Cloud scraper
        run: python google.py

      - name: Show the saved CSV in the log
        run: head -20 google_cloud_gpu_pricing.csv

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-cloud-gpu-pricing
          path: google_cloud_gpu_pricing.csv
          if-no-files-found: warn
          
