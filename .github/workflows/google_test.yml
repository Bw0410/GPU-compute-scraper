
name: Test Google Cloud GPU Scraper

on:
  workflow_dispatch:  # Manual only

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Google script
        run: python google.py

      - name: Show saved CSV in log
        if: always()
        run: |
          if [ -f google_cloud_gpu_pricing.csv ]; then
            head -20 google_cloud_gpu_pricing.csv
          else
            echo "CSV not found"
          fi

      - name: Upload Google CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-cloud-gpu-pricing
          path: google_cloud_gpu_pricing.csv
          if-no-files-found: warn

