
name: Test GPU Pricing Scraper

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run GPU pricing scraper
        run: python scrape.py

      - name: Verify CSV output
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          file = Path("google_cloud_gpu_pricing.csv")

          assert file.exists(), "CSV file was not created"

          df = pd.read_csv(file)

          assert not df.empty, "CSV is empty"
          assert "Region" in df.columns, "Region column missing"
          assert "Machine type" in df.columns, "Machine type column missing"

          print("Scraper test passed!")
          print(f"Rows: {len(df)}")
          print(f"Regions: {df['Region'].nunique()}")
          print(df.head().to_string(index=False))
          PY

      - name: Upload scraped CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-cloud-gpu-pricing
          path: google_cloud_gpu_pricing.csv
          if-no-files-found: warn
